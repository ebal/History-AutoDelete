# Builds the Firefox and Chrome packages when a v* tag is pushed and attaches
# them to a Gitea release. Runs in the same image as docker-compose.yml.
#
# Gitea reads .gitea/workflows/ and ignores .github/workflows/ when this
# directory exists, so the GitHub workflow never runs here.
#
# The built-in token needs write access to releases. If the job fails with
# 403, add a personal access token (scope: write:repository) as the repository
# secret RELEASE_TOKEN.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container: node:22.11.0-alpine3.20
    steps:
      - name: Install build tools
        run: apk add --no-cache bash git zip curl jq

      - uses: actions/checkout@v4

      - name: Test
        run: node --test

      - name: Check version and extract release notes
        run: ./tools/release-notes.sh "$GITHUB_REF_NAME" > /tmp/notes.md

      - name: Build
        run: ./tools/build.sh

      - name: Publish release
        env:
          GITEA_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
        run: ./tools/gitea-release.sh "$GITHUB_REF_NAME" /tmp/notes.md
